[workspace]
resolver = "2"
members = [
    "crates/pipe-core",
    "crates/pipe-parser",
    "crates/pipe-stages",
    "crates/pipe-rexx",
    "crates/pipe-python",
    "crates/pipe-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Portable Pipelines: a portable implementation of IBM CMS Pipelines (z/VM)"
repository = "https://github.com/portable-pipelines/portable-pipelines"
homepage = "https://github.com/portable-pipelines/portable-pipelines"
rust-version = "1.75"
publish = false

[workspace.dependencies]
pipe-core = { path = "crates/pipe-core" }
pipe-parser = { path = "crates/pipe-parser" }
pipe-stages = { path = "crates/pipe-stages" }
pipe-rexx = { path = "crates/pipe-rexx" }
pipe-python = { path = "crates/pipe-python" }
corosensei = "0.2"
thiserror = "2"
anyhow = "1"
