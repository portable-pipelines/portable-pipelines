[package]
name = "pipe-stages"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Built-in Portable Pipelines stages for the pipe command"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
pipe-core = { workspace = true }
pipe-parser = { workspace = true }
thiserror = { workspace = true }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
# JSON-per-row records (experimental portable extension). preserve_order keeps
# CSV header order and json add/set insertion order. No other serde crates.
serde_json = { version = "1", features = ["preserve_order"] }
