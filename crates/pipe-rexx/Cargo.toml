[package]
name = "pipe-rexx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REXX stage bridge with pipeline subcommands (Regina-compatible API; embedded subset runtime)"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
ctor = "0.2"
once_cell = "1.21.4"
pipe-core = { workspace = true }
pipe-helper = { workspace = true }
pipe-parser = { workspace = true }
pipe-stages = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libloading = "0.9"
