[package]
name = "pipe-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop editor and debugger for Portable Pipelines"
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version = "1.85"

[[bin]]
name = "pipe-gui"
path = "src/main.rs"

[lib]
name = "pipe_gui"
path = "src/lib.rs"

[dependencies]
pipe-core = { workspace = true }
pipe-parser = { workspace = true }
pipe-stages = { workspace = true }
pipe-rexx = { workspace = true }
pipe-python = { workspace = true }
eframe = { version = "0.32", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32"
png = "0.17"

[target.'cfg(windows)'.dependencies]
# Native Windows file dialogs (comdlg32). No extra runtime.
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", default-features = false }
