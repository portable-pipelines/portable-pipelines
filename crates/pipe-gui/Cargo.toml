[package]
name = "pipe-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop GUI for Portable Pipelines"
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version = "1.85"

[[bin]]
name = "pipe-gui"
path = "src/main.rs"

[lib]
name = "pipe_gui"
path = "src/lib.rs"

[dependencies]
pipe-core = { workspace = true }
pipe-parser = { workspace = true }
pipe-stages = { workspace = true }
pipe-rexx = { workspace = true }
pipe-python = { workspace = true }
eframe = { version = "0.32", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
] }
# eframe's `wgpu` feature does not enable native backends when eframe
# default-features are off. Turn DX12/Vulkan/Metal/GLES on here so wgpu
# does not panic with "no backend feature ... was enabled".
wgpu = { version = "25.0", default-features = false, features = [
    "dx12",
    "metal",
    "gles",
    "vulkan",
    "wgsl",
] }
egui = "0.32"
png = "0.17"
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
# Native Windows file dialogs (comdlg32). No extra runtime.
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", default-features = false }

# Windows-only: embed assets/pipe-gui.ico in pipe-gui.exe. Linux/macOS
# builds skip this; CI compiles each OS natively, so no cross-compile path.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
