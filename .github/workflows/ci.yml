# Test suite on Linux, macOS (Apple silicon), and Windows.
# Does not sign binaries and does not use secrets. The release
# workflow (release.yml) is the one that signs.

name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PIPE_REQUIRE_REGINA: "1"
  PIPE_REQUIRE_PYTHON: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustup show
          rustc -vV

      - name: Install MSVC Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install Regina and Python (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y regina-rexx libregina3-dev python3
          python3 --version
          ls -l /usr/lib/x86_64-linux-gnu/libregina* /usr/lib/libregina* 2>/dev/null || true

      - name: Install Regina (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          brew install regina-rexx
          python3 --version
          prefix="$(brew --prefix)"
          formula_prefix="$(brew --prefix regina-rexx)"
          echo "brew prefix: ${prefix}"
          echo "regina-rexx prefix: ${formula_prefix}"
          found=""
          for cand in \
            "${formula_prefix}/lib/libregina.dylib" \
            "${formula_prefix}/lib/libregina.3.dylib" \
            "${prefix}/lib/libregina.dylib" \
            "${prefix}/lib/libregina.3.dylib"
          do
            if [ -f "${cand}" ]; then
              echo "found Regina library: ${cand}"
              found="${cand}"
              break
            fi
          done
          if [ -z "${found}" ]; then
            echo "Regina library not found after brew install. Search:"
            find "${formula_prefix}" "${prefix}/lib" -name 'libregina*' -print || true
            exit 1
          fi
          echo "PIPE_REGINA=${found}" >> "${GITHUB_ENV}"

      - name: Fetch official Regina Windows zip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'regina-windows'
          powershell -File .\scripts\fetch-regina-windows.ps1 -OutDir $out
          $extract = Join-Path $out 'extract'
          if (-not (Test-Path -LiteralPath $extract)) {
            throw "missing extracted Regina directory: $extract"
          }
          $dll = @(Get-ChildItem -LiteralPath $extract -Recurse -Force -File |
            Where-Object { $_.Name -eq 'regina.dll' -or $_.Name -eq 'regina64.dll' } |
            Select-Object -First 1)
          if ($dll.Count -lt 1) {
            throw "extracted Regina zip but did not find regina.dll under $extract"
          }
          $dllPath = $dll[0].FullName
          $dllDir = $dll[0].DirectoryName
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PIPE_REGINA=$dllPath"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dllDir
          Write-Host "PIPE_REGINA=$dllPath"
          Write-Host "Added to PATH: $dllDir"
          py -3 --version
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          }

      - name: Run tests
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

  release-tools:
    name: release helpers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Python unit tests for release helpers
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -eu
          curl -sSfL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -verbose

      - name: Validate release intent if present
        run: python3 scripts/release/prepare_release.py check
