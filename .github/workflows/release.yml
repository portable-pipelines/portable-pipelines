name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build and sign only the Windows zip and skip Linux and macOS. Does not publish a GitHub Release. Use this to test Microsoft Artifact Signing.
        type: boolean
        default: false
  pull_request:

# pull_request and workflow_dispatch build assets but do not publish a GitHub Release.
# The Windows zip is built on a GitHub-hosted Windows runner (MSVC). On
# workflow_dispatch and published releases, pipe.exe is Authenticode-signed
# with Microsoft Artifact Signing (GitHub OIDC, environment `signing`) before
# the zip is written. A published Release also attaches the zip with a .sha256
# file. workflow_dispatch (windows_only=true skips Linux and macOS) is the
# signing dry run: same sign-and-zip path, no release upload.
# pull_request skips Azure login and signing so packaging CI does not consume
# signing quota and does not fail when OIDC has not been exercised yet.

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  unix:
    name: ${{ matrix.asset }}
    if: github.event_name != 'pull_request' && github.event.inputs.windows_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: pipe-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: pipe-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: pipe-macos-x86_64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build pipe (release)
        run: cargo build --release --target "${{ matrix.target }}" -p pipe-cli

      - name: Smoke test built binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          BIN="target/${TARGET}/release/pipe"
          if [ ! -x "${BIN}" ]; then
            echo "missing built binary: ${BIN}"
            exit 1
          fi
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf 'hello\n' > "${expected}"
          run_smoke() {
            "$@" "literal hello| console" > "${actual}"
            if ! cmp -s "${expected}" "${actual}"; then
              echo "smoke test failed: expected stdout to be exactly hello"
              echo "actual bytes:"
              od -An -tx1 "${actual}"
              exit 1
            fi
            echo "smoke test ok: literal hello| console -> hello"
          }
          if [ "${TARGET}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 true >/dev/null 2>&1; then
              run_smoke arch -x86_64 "${BIN}"
            else
              echo "Rosetta (arch -x86_64) is not available on this runner; skipping the x86_64 smoke test."
            fi
          else
            run_smoke "${BIN}"
          fi

      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git rev-parse --short HEAD)"
          fi
          STAGE="dist/${ASSET}"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/pipe" "${STAGE}/pipe"
          chmod +x "${STAGE}/pipe"
          cp -R examples "${STAGE}/examples"
          cp -R crates/pipe-python/python/pipelines "${STAGE}/pipelines"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGE}/"
          cp packaging/unix/README.txt "${STAGE}/README.txt"
          find "${STAGE}" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "${STAGE}" -type f -name '*.pyc' -delete
          mkdir -p dist
          TARBALL="${ASSET}-${TAG}.tar.gz"
          tar -C dist -czf "dist/${TARBALL}" "${ASSET}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${TARBALL}" > "${TARBALL}.sha256")
          else
            (cd dist && shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256")
          fi
          ls -l "dist/${TARBALL}" "dist/${TARBALL}.sha256"
          cat "dist/${TARBALL}.sha256"
          tar -tzf "dist/${TARBALL}"

      - name: Attest tarball
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/${{ matrix.asset }}-*.tar.gz

      - name: Upload tarball and checksum to the GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release upload "${GITHUB_REF_NAME}" \
            dist/${{ matrix.asset }}-*.tar.gz \
            dist/${{ matrix.asset }}-*.tar.gz.sha256 \
            --clobber

  windows:
    name: pipe-windows-x64
    runs-on: windows-latest
    # Entra federated credential is scoped to this repo and environment name.
    environment: signing
    permissions:
      id-token: write
      contents: write
      attestations: write
    env:
      # Not secrets. The app registration is trusted via GitHub OIDC only.
      AZURE_CLIENT_ID: c4f09a0f-9e9f-43d1-81b5-02a2ffc7656d
      AZURE_TENANT_ID: b40e0870-645d-4d29-8551-28e1a16c3105
      AZURE_SUBSCRIPTION_ID: 88e6dd5e-b97e-4dba-b545-6909f5382b99
      ARTIFACT_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
      ARTIFACT_SIGNING_ACCOUNT: PortablePipelines
      ARTIFACT_SIGNING_PROFILE: portable-pipelines
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustup show
          rustc -vV

      - name: Install MSVC Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Fetch official Regina Windows zip
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'regina-windows'
          powershell -File .\scripts\fetch-regina-windows.ps1 -OutDir $out

      - name: Stage Windows package (MSVC)
        run: |
          $regina = Join-Path $env:RUNNER_TEMP 'regina-windows\extract'
          $packArgs = @(
            '-File', '.\scripts\package-windows.ps1',
            '-Target', 'msvc',
            '-ReginaDir', $regina,
            '-NoZip',
            '-Verbose'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $packArgs += @('-Version', $env:GITHUB_REF_NAME)
          }
          Write-Host "Running: powershell $($packArgs -join ' ')"
          & powershell @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw "package-windows.ps1 failed with exit code $LASTEXITCODE"
          }
          $stageDirs = @(Get-ChildItem -LiteralPath 'dist' -Directory -Filter 'pipe-windows-x64-*')
          if ($stageDirs.Count -ne 1) {
            throw "expected exactly one staging directory dist/pipe-windows-x64-*, found $($stageDirs.Count)"
          }
          $stage = $stageDirs[0].FullName
          $exe = Join-Path $stage 'pipe.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "missing $exe"
          }
          # First-party PE files we built. Do not sign third-party binaries we
          # ship but do not own: official Regina (regina.dll) and MinGW
          # runtimes (libgcc_s_seh-1.dll, libwinpthread-1.dll) when present.
          $firstParty = New-Object System.Collections.Generic.List[string]
          $firstParty.Add($exe) | Out-Null
          foreach ($dll in @(Get-ChildItem -LiteralPath $stage -File -Filter '*.dll')) {
            $name = $dll.Name.ToLowerInvariant()
            if ($name -eq 'regina.dll' -or $name -eq 'regina64.dll' -or $name -eq 'regina32.dll') {
              Write-Host "Not signing third-party Regina DLL: $($dll.Name)"
              continue
            }
            if ($name -eq 'libgcc_s_seh-1.dll' -or $name -eq 'libwinpthread-1.dll') {
              Write-Host "Not signing third-party MinGW runtime: $($dll.Name)"
              continue
            }
            Write-Host "Signing first-party DLL: $($dll.Name)"
            $firstParty.Add($dll.FullName) | Out-Null
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_STAGE=$stage"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PIPE_EXE=$exe"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SIGN_FILES=$($firstParty -join ',')"
          Write-Host "Will sign:"
          foreach ($path in $firstParty) {
            Write-Host "  $path"
          }

      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign first-party binaries with Microsoft Artifact Signing
        if: github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.SIGN_FILES }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true

      - name: Verify Authenticode signature
        if: github.event_name != 'pull_request'
        run: |
          $paths = @($env:SIGN_FILES -split ',')
          if ($paths.Count -lt 1 -or [string]::IsNullOrWhiteSpace($paths[0])) {
            throw 'SIGN_FILES was empty; nothing to verify'
          }
          foreach ($path in $paths) {
            $path = $path.Trim()
            if (-not $path) {
              continue
            }
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing file to verify: $path"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host $path
            Write-Host "  Status: $($sig.Status)"
            Write-Host "  StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
            }
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode status for $path was '$($sig.Status)', expected Valid"
            }
          }
          Write-Host 'Authenticode signature is Valid'

      - name: Zip staged Windows package
        run: |
          $packArgs = @(
            '-File', '.\scripts\package-windows.ps1',
            '-ZipOnly',
            '-Verbose'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $packArgs += @('-Version', $env:GITHUB_REF_NAME)
          }
          Write-Host "Running: powershell $($packArgs -join ' ')"
          & powershell @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw "package-windows.ps1 -ZipOnly failed with exit code $LASTEXITCODE"
          }

      - name: Smoke test staged zip
        run: |
          $zips = @(Get-ChildItem -LiteralPath 'dist' -Filter 'pipe-windows-x64-*.zip' -File |
            Where-Object { $_.Name -notlike '*.sha256' })
          if ($zips.Count -ne 1) {
            throw "expected exactly one pipe-windows-x64-*.zip in dist/, found $($zips.Count)"
          }
          $zip = $zips[0]
          Write-Host "Zip: $($zip.FullName) ($($zip.Length) bytes)"
          $shaFiles = @(Get-ChildItem -LiteralPath 'dist' -Filter 'pipe-windows-x64-*.zip.sha256' -File)
          if ($shaFiles.Count -ne 1) {
            throw "expected exactly one pipe-windows-x64-*.zip.sha256 in dist/, found $($shaFiles.Count)"
          }
          Write-Host "Checksum file:"
          Get-Content -LiteralPath $shaFiles[0].FullName

          $stageDirs = @(Get-ChildItem -LiteralPath 'dist' -Directory -Filter 'pipe-windows-x64-*')
          if ($stageDirs.Count -lt 1) {
            throw "missing staging directory dist/pipe-windows-x64-*"
          }
          $stage = $stageDirs[0].FullName
          $exe = Join-Path $stage 'pipe.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "missing $exe"
          }
          $dll = Join-Path $stage 'regina.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "missing $dll (Regina must be bundled in the zip)"
          }

          $hello = & $exe 'literal hello| console'
          if ($LASTEXITCODE -ne 0) {
            throw "pipe.exe smoke test failed with exit code $LASTEXITCODE"
          }
          $helloText = ($hello | Out-String).Trim()
          if ($helloText -ne 'hello') {
            throw "pipe.exe stdout was '$helloText', expected 'hello'"
          }
          Write-Host 'smoke test ok: literal hello| console -> hello'

          Push-Location $stage
          try {
            $upper = & .\pipe.exe 'literal hello| examples\upper.rexx | console'
            if ($LASTEXITCODE -ne 0) {
              throw "REXX smoke test failed with exit code $LASTEXITCODE"
            }
            $upperText = ($upper | Out-String).Trim()
            if ($upperText -ne 'HELLO') {
              throw "REXX stdout was '$upperText', expected 'HELLO'"
            }
            Write-Host 'smoke test ok: literal hello| examples\upper.rexx | console -> HELLO'
          }
          finally {
            Pop-Location
          }

      - name: Attest Windows zip
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/pipe-windows-x64-*.zip

      - name: Upload zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipe-windows-x64
          path: |
            dist/pipe-windows-x64-*.zip
            dist/pipe-windows-x64-*.zip.sha256
          if-no-files-found: error

      - name: Upload zip and checksum to the GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          gh release upload "${GITHUB_REF_NAME}" \
            dist/pipe-windows-x64-*.zip \
            dist/pipe-windows-x64-*.zip.sha256 \
            --clobber
