name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build and sign only the Windows zip and skip Linux and macOS. Empty tag and upload_release=false is the signing dry run (no GitHub Release).
        type: boolean
        default: false
      tag:
        description: Existing vX.Y.Z tag to upload into. Empty keeps this a signing dry run that does not upload.
        type: string
        default: ""
      checkout_ref:
        description: Forty-character commit SHA to build. Empty uses github.sha. For recovery, pass the tagged commit, not a later workflow-only fix.
        type: string
        default: ""
      upload_release:
        description: Upload archives to the existing GitHub Release named by tag. Does not publish a draft. Default false.
        type: boolean
        default: false
      sign:
        description: Authenticode-sign Windows first-party binaries.
        type: boolean
        default: true
      stable_aliases:
        description: Also write and upload the unversioned stable names. Requires tag.
        type: boolean
        default: false
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: Version tag to stamp on assets, such as v0.1.7. Empty uses the short git SHA.
        type: string
        required: false
        default: ""
      checkout_ref:
        description: Forty-character commit SHA to build. Empty uses github.sha.
        type: string
        required: false
        default: ""
      upload_release:
        description: Upload archives to the GitHub Release named by tag.
        type: boolean
        required: false
        default: false
      sign:
        description: Authenticode-sign Windows first-party binaries.
        type: boolean
        required: false
        default: true
      stable_aliases:
        description: Also write and upload the unversioned stable names.
        type: boolean
        required: false
        default: false
      windows_only:
        description: Skip Linux and macOS jobs.
        type: boolean
        required: false
        default: false
      caller:
        description: Who invoked this reusable workflow. Pass intent from release-from-intent.yml. GitHub reports the parent event name (push) inside a called workflow, so this input is how packaging-mode knows it is a reusable call.
        type: string
        required: false
        default: ""

# A reusable workflow keeps the caller's github.event_name. release-from-intent
# is a push, so this file sees EVENT_NAME=push, not workflow_call. Packaging
# mode therefore keys off workflow_call inputs (caller: intent, tag, upload)
# rather than the event name. pull_request stays an unsigned Windows dry run.
#
# pull_request and a workflow_dispatch with an empty tag build assets but do not
# publish a GitHub Release. A workflow_dispatch that sets tag plus
# upload_release=true uploads onto an existing draft and does not publish it.
# The Windows zip is built on a GitHub-hosted Windows runner (MSVC). On
# workflow_dispatch, published releases, and a workflow_call from the intent
# workflow, pipe.exe and pipe-gui.exe are Authenticode-signed with Microsoft Artifact Signing
# (GitHub OIDC, environment `signing`) before the zip is written. A published
# Release attaches the versioned zip (pipe-windows-x64-<tag>.zip) and a second
# copy of the same bytes as pipe-windows-x64.zip. Each file has its own .sha256
# checksum, and the checksum names that file. Unix tarballs follow the same
# pattern (pipe-linux-x86_64-<tag>.tar.gz and pipe-linux-x86_64.tar.gz, and the
# two macOS names). workflow_dispatch with an empty tag is the signing dry run
# (windows_only=true skips Linux and macOS): same sign-and-zip path, versioned
# names only, no release upload.
# pull_request skips Azure login and signing so packaging CI does not consume
# signing quota and does not fail when OIDC has not been exercised yet.
#
# A release or tag created with GITHUB_TOKEN does not start another workflow
# from that event. Chat-driven publishing therefore calls this file as a
# reusable workflow from release-from-intent.yml in the same run, instead of
# waiting for release: published. A human-published GitHub Release still uses
# the release: published trigger, because that event is not from GITHUB_TOKEN.

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-package-${{ github.event.release.tag_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  config:
    name: Packaging mode
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cfg.outputs.tag }}
      checkout_ref: ${{ steps.cfg.outputs.checkout_ref }}
      upload_release: ${{ steps.cfg.outputs.upload_release }}
      sign: ${{ steps.cfg.outputs.sign }}
      stable_aliases: ${{ steps.cfg.outputs.stable_aliases }}
      run_unix: ${{ steps.cfg.outputs.run_unix }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Resolve packaging mode
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          CALL_TAG: ${{ inputs.tag }}
          CALL_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          CALL_UPLOAD_RELEASE: ${{ inputs.upload_release }}
          CALL_SIGN: ${{ inputs.sign }}
          CALL_STABLE_ALIASES: ${{ inputs.stable_aliases }}
          CALL_WINDOWS_ONLY: ${{ inputs.windows_only }}
          CALL_CALLER: ${{ inputs.caller }}
          DISPATCH_WINDOWS_ONLY: ${{ github.event.inputs.windows_only }}
        run: python3 scripts/release/prepare_release.py workflow-config --github-output "$GITHUB_OUTPUT"

  unix:
    name: ${{ matrix.asset }}
    needs: config
    if: needs.config.outputs.run_unix == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.config.outputs.tag }}
      STABLE_ALIASES: ${{ needs.config.outputs.stable_aliases }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: pipe-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pipe-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: pipe-macos-x86_64
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.checkout_ref }}

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install GUI libraries (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libx11-xcb-dev pkg-config

      - name: Build pipe and pipe-gui (release)
        run: cargo build --release --target "${{ matrix.target }}" -p pipe-cli -p pipe-gui

      - name: Smoke test built binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          BIN="target/${TARGET}/release/pipe"
          GUI="target/${TARGET}/release/pipe-gui"
          if [ ! -x "${BIN}" ]; then
            echo "missing built binary: ${BIN}"
            exit 1
          fi
          if [ ! -x "${GUI}" ]; then
            echo "missing built GUI: ${GUI}"
            exit 1
          fi
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf 'hello\n' > "${expected}"
          run_smoke() {
            "$@" "literal hello| console" > "${actual}"
            if ! cmp -s "${expected}" "${actual}"; then
              echo "smoke test failed: expected stdout to be exactly hello"
              echo "actual bytes:"
              od -An -tx1 "${actual}"
              exit 1
            fi
            echo "smoke test ok: literal hello| console -> hello"
          }
          if [ "${TARGET}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 true >/dev/null 2>&1; then
              run_smoke arch -x86_64 "${BIN}"
            else
              echo "Rosetta (arch -x86_64) is not available on this runner; skipping the x86_64 smoke test."
            fi
          else
            run_smoke "${BIN}"
          fi
          run_gui_help() {
            local out
            out="$("$@" --gui --help)"
            echo "${out}"
            echo "${out}" | grep -q 'desktop GUI is' || {
              echo "pipe --gui --help did not resolve the GUI binary"
              exit 1
            }
            echo "smoke test ok: pipe --gui --help"
          }
          if [ "${TARGET}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 true >/dev/null 2>&1; then
              run_gui_help arch -x86_64 "${BIN}"
            fi
          else
            run_gui_help "${BIN}"
          fi

      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          if [ -n "${RELEASE_TAG}" ]; then
            TAG="${RELEASE_TAG}"
          else
            TAG="$(git rev-parse --short HEAD)"
          fi
          STAGE="dist/${ASSET}"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/pipe" "${STAGE}/pipe"
          chmod +x "${STAGE}/pipe"
          cp "target/${TARGET}/release/pipe-gui" "${STAGE}/pipe-gui"
          chmod +x "${STAGE}/pipe-gui"
          if [ ! -x "${STAGE}/pipe-gui" ]; then
            echo "missing staged pipe-gui: ${STAGE}/pipe-gui"
            exit 1
          fi
          cp -R examples "${STAGE}/examples"
          cp -R crates/pipe-python/python/pipelines "${STAGE}/pipelines"
          cp -R docs "${STAGE}/docs"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGE}/"
          cp packaging/unix/README.txt "${STAGE}/README.txt"
          find "${STAGE}" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "${STAGE}" -type f -name '*.pyc' -delete
          # Local IBM PDFs and extract scratch under docs/ are gitignored and
          # must not land in the tarball if a maintainer has them checked out.
          find "${STAGE}/docs" -type f -name '*.pdf' -delete
          find "${STAGE}/docs" -type f \( -name '*-extract.tmp.txt' -o -name '_*.tmp.txt' \) -delete
          if [ ! -f "${STAGE}/docs/STATUS.md" ]; then
            echo "missing staged docs/STATUS.md"
            exit 1
          fi
          run_staged_gui_help() {
            local out
            out="$("${STAGE}/pipe" --gui --help)"
            echo "${out}"
            echo "${out}" | grep -q 'desktop GUI is' || {
              echo "staged pipe --gui --help did not resolve pipe-gui"
              exit 1
            }
            echo "staged pipe --gui --help ok"
          }
          if [ "${TARGET}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 true >/dev/null 2>&1; then
              run_staged_gui_help
            else
              echo "Rosetta (arch -x86_64) is not available; pipe-gui is staged but --gui --help was not executed."
            fi
          else
            run_staged_gui_help
          fi
          mkdir -p dist
          TARBALL="${ASSET}-${TAG}.tar.gz"
          tar -C dist -czf "dist/${TARBALL}" "${ASSET}"
          write_sha256() {
            # GNU sha256sum text: "<hex>  <filename>". Run from dist/.
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            else
              shasum -a 256 "$1" > "$1.sha256"
            fi
          }
          (cd dist && write_sha256 "${TARBALL}")
          # A published Release also uploads these same bytes under a stable
          # name with no version, so .../releases/latest/download/ keeps
          # working. workflow_dispatch keeps the git-sha name only.
          if [ "${STABLE_ALIASES}" = "true" ]; then
            cp -f "dist/${TARBALL}" "dist/${ASSET}.tar.gz"
            (cd dist && write_sha256 "${ASSET}.tar.gz")
            ver_hash="$(awk 'NR==1 { print $1 }' "dist/${TARBALL}.sha256")"
            alias_hash="$(awk 'NR==1 { print $1 }' "dist/${ASSET}.tar.gz.sha256")"
            if [ "${ver_hash}" != "${alias_hash}" ]; then
              echo "stable alias checksum does not match ${TARBALL}"
              exit 1
            fi
            if ! grep -q "  ${ASSET}.tar.gz" "dist/${ASSET}.tar.gz.sha256"; then
              echo "stable alias checksum does not name ${ASSET}.tar.gz"
              exit 1
            fi
            ls -l "dist/${ASSET}.tar.gz" "dist/${ASSET}.tar.gz.sha256"
            cat "dist/${ASSET}.tar.gz.sha256"
          fi
          ls -l "dist/${TARBALL}" "dist/${TARBALL}.sha256"
          cat "dist/${TARBALL}.sha256"
          tar -tzf "dist/${TARBALL}"

      - name: Attest tarball
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/${{ matrix.asset }}*.tar.gz

      - name: Upload tarball and checksum to the GitHub Release
        if: needs.config.outputs.upload_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release upload "${{ needs.config.outputs.tag }}" \
            dist/${{ matrix.asset }}-*.tar.gz \
            dist/${{ matrix.asset }}-*.tar.gz.sha256 \
            dist/${{ matrix.asset }}.tar.gz \
            dist/${{ matrix.asset }}.tar.gz.sha256 \
            --clobber

  windows:
    name: pipe-windows-x64
    needs: config
    runs-on: windows-latest
    # Entra federated credential is scoped to this repo and environment name.
    environment: signing
    permissions:
      id-token: write
      contents: write
      attestations: write
    env:
      # Not secrets. The app registration is trusted via GitHub OIDC only.
      AZURE_CLIENT_ID: c4f09a0f-9e9f-43d1-81b5-02a2ffc7656d
      AZURE_TENANT_ID: b40e0870-645d-4d29-8551-28e1a16c3105
      AZURE_SUBSCRIPTION_ID: 88e6dd5e-b97e-4dba-b545-6909f5382b99
      ARTIFACT_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
      ARTIFACT_SIGNING_ACCOUNT: PortablePipelines
      ARTIFACT_SIGNING_PROFILE: portable-pipelines
      RELEASE_TAG: ${{ needs.config.outputs.tag }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.checkout_ref }}

      - name: Show Rust toolchain
        run: |
          rustup show
          rustc -vV

      - name: Install MSVC Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Fetch official Regina Windows zip
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'regina-windows'
          powershell -File .\scripts\fetch-regina-windows.ps1 -OutDir $out

      - name: Stage Windows package (MSVC)
        run: |
          $regina = Join-Path $env:RUNNER_TEMP 'regina-windows\extract'
          $packArgs = @(
            '-File', '.\scripts\package-windows.ps1',
            '-Target', 'msvc',
            '-ReginaDir', $regina,
            '-NoZip',
            '-Verbose'
          )
          if ($env:RELEASE_TAG) {
            $packArgs += @('-Version', $env:RELEASE_TAG)
          }
          Write-Host "Running: powershell $($packArgs -join ' ')"
          & powershell @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw "package-windows.ps1 failed with exit code $LASTEXITCODE"
          }
          $stageDirs = @(Get-ChildItem -LiteralPath 'dist' -Directory -Filter 'pipe-windows-x64-*')
          if ($stageDirs.Count -ne 1) {
            throw "expected exactly one staging directory dist/pipe-windows-x64-*, found $($stageDirs.Count)"
          }
          $stage = $stageDirs[0].FullName
          $exe = Join-Path $stage 'pipe.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "missing $exe"
          }
          $gui = Join-Path $stage 'pipe-gui.exe'
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf)) {
            throw "missing $gui (pipe-gui.exe must ship next to pipe.exe)"
          }
          # First-party PE files we built. Do not sign third-party binaries we
          # ship but do not own: official Regina (regina.dll) and MinGW
          # runtimes (libgcc_s_seh-1.dll, libwinpthread-1.dll) when present.
          $firstParty = New-Object System.Collections.Generic.List[string]
          $firstParty.Add($exe) | Out-Null
          $firstParty.Add($gui) | Out-Null
          foreach ($dll in @(Get-ChildItem -LiteralPath $stage -File -Filter '*.dll')) {
            $name = $dll.Name.ToLowerInvariant()
            if ($name -eq 'regina.dll' -or $name -eq 'regina64.dll' -or $name -eq 'regina32.dll') {
              Write-Host "Not signing third-party Regina DLL: $($dll.Name)"
              continue
            }
            if ($name -eq 'libgcc_s_seh-1.dll' -or $name -eq 'libwinpthread-1.dll') {
              Write-Host "Not signing third-party MinGW runtime: $($dll.Name)"
              continue
            }
            Write-Host "Signing first-party DLL: $($dll.Name)"
            $firstParty.Add($dll.FullName) | Out-Null
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_STAGE=$stage"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PIPE_EXE=$exe"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SIGN_FILES=$($firstParty -join ',')"
          Write-Host "Will sign:"
          foreach ($path in $firstParty) {
            Write-Host "  $path"
          }

      - name: Azure login (OIDC)
        if: needs.config.outputs.sign == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign first-party binaries with Microsoft Artifact Signing
        if: needs.config.outputs.sign == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.SIGN_FILES }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true

      - name: Verify Authenticode signature
        if: needs.config.outputs.sign == 'true'
        run: |
          $paths = @($env:SIGN_FILES -split ',')
          if ($paths.Count -lt 1 -or [string]::IsNullOrWhiteSpace($paths[0])) {
            throw 'SIGN_FILES was empty; nothing to verify'
          }
          foreach ($path in $paths) {
            $path = $path.Trim()
            if (-not $path) {
              continue
            }
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing file to verify: $path"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host $path
            Write-Host "  Status: $($sig.Status)"
            Write-Host "  StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
            }
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode status for $path was '$($sig.Status)', expected Valid"
            }
          }
          Write-Host 'Authenticode signature is Valid'

      - name: Zip staged Windows package
        run: |
          $packArgs = @(
            '-File', '.\scripts\package-windows.ps1',
            '-ZipOnly',
            '-Verbose'
          )
          if ($env:RELEASE_TAG) {
            $packArgs += @('-Version', $env:RELEASE_TAG)
          }
          Write-Host "Running: powershell $($packArgs -join ' ')"
          & powershell @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw "package-windows.ps1 -ZipOnly failed with exit code $LASTEXITCODE"
          }

      - name: Smoke test staged zip
        run: |
          $zips = @(Get-ChildItem -LiteralPath 'dist' -Filter 'pipe-windows-x64-*.zip' -File |
            Where-Object { $_.Name -notlike '*.sha256' })
          if ($zips.Count -ne 1) {
            throw "expected exactly one pipe-windows-x64-*.zip in dist/, found $($zips.Count)"
          }
          $zip = $zips[0]
          Write-Host "Zip: $($zip.FullName) ($($zip.Length) bytes)"
          $shaFiles = @(Get-ChildItem -LiteralPath 'dist' -Filter 'pipe-windows-x64-*.zip.sha256' -File)
          if ($shaFiles.Count -ne 1) {
            throw "expected exactly one pipe-windows-x64-*.zip.sha256 in dist/, found $($shaFiles.Count)"
          }
          Write-Host "Checksum file:"
          Get-Content -LiteralPath $shaFiles[0].FullName

          $stageDirs = @(Get-ChildItem -LiteralPath 'dist' -Directory -Filter 'pipe-windows-x64-*')
          if ($stageDirs.Count -lt 1) {
            throw "missing staging directory dist/pipe-windows-x64-*"
          }
          $stage = $stageDirs[0].FullName
          $exe = Join-Path $stage 'pipe.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "missing $exe"
          }
          $gui = Join-Path $stage 'pipe-gui.exe'
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf)) {
            throw "missing $gui (pipe-gui.exe must be bundled in the zip)"
          }
          $dll = Join-Path $stage 'regina.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "missing $dll (Regina must be bundled in the zip)"
          }

          $guiHelp = & $exe --gui --help
          if ($LASTEXITCODE -ne 0) {
            throw "pipe --gui --help failed with exit code $LASTEXITCODE"
          }
          $guiHelpText = ($guiHelp | Out-String)
          if ($guiHelpText -notmatch 'desktop GUI is') {
            throw "pipe --gui --help did not resolve pipe-gui.exe: $guiHelpText"
          }
          Write-Host 'smoke test ok: pipe --gui --help'

          $hello = & $exe 'literal hello| console'
          if ($LASTEXITCODE -ne 0) {
            throw "pipe.exe smoke test failed with exit code $LASTEXITCODE"
          }
          $helloText = ($hello | Out-String).Trim()
          if ($helloText -ne 'hello') {
            throw "pipe.exe stdout was '$helloText', expected 'hello'"
          }
          Write-Host 'smoke test ok: literal hello| console -> hello'

          Push-Location $stage
          try {
            $upper = & .\pipe.exe 'literal hello| examples\upper.rexx | console'
            if ($LASTEXITCODE -ne 0) {
              throw "REXX smoke test failed with exit code $LASTEXITCODE"
            }
            $upperText = ($upper | Out-String).Trim()
            if ($upperText -ne 'HELLO') {
              throw "REXX stdout was '$upperText', expected 'HELLO'"
            }
            Write-Host 'smoke test ok: literal hello| examples\upper.rexx | console -> HELLO'
          }
          finally {
            Pop-Location
          }

      - name: Attest Windows zip
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/pipe-windows-x64*.zip

      - name: Upload zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipe-windows-x64
          path: |
            dist/pipe-windows-x64-*.zip
            dist/pipe-windows-x64-*.zip.sha256
          if-no-files-found: error

      - name: Upload zip and checksum to the GitHub Release
        if: needs.config.outputs.upload_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          gh release upload "${{ needs.config.outputs.tag }}" \
            dist/pipe-windows-x64-*.zip \
            dist/pipe-windows-x64-*.zip.sha256 \
            dist/pipe-windows-x64.zip \
            dist/pipe-windows-x64.zip.sha256 \
            --clobber
